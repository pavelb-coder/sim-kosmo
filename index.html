<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>КосмоЛаб — Виртуальные лаборатории Космоквантума</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <!-- TOP NAVIGATION BAR -->
    <header class="topbar">
      <div class="brand" title="Виртуальный практикум для детских технопарков «Кванториум»">
        <div class="brand-logo" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(-28 12 12)"></ellipse>
            <circle cx="18.5" cy="8.5" r="1.5" fill="#fbbf24" stroke="none"></circle>
          </svg>
        </div>
        <div>
          <div class="brand-title">
            КОСМОЛАБ <span class="brand-badge">Космоквантум</span>
          </div>
          <div class="topbar-brand-sub">Без регистрации · В браузере · 5 стендов и 17 практикумов</div>
        </div>
      </div>

      <!-- 5 LABORATORY TABS -->
      <nav class="lab-tabs" aria-label="Лабораторные стенды">
        <button class="lab-tab active" data-lab="cubesat">
          <span class="tab-num">1</span> CubeSat · ОрбиКрафт
        </button>
        <button class="lab-tab" data-lab="orbit">
          <span class="tab-num">2</span> Орбиты и манёвры
        </button>
        <button class="lab-tab" data-lab="rocket">
          <span class="tab-num">3</span> Ракета и CanSat · OpenRocket
        </button>
        <button class="lab-tab" data-lab="sdr">
          <span class="tab-num">4</span> Приём ДЗЗ · SDR
        </button>
        <button class="lab-tab" data-lab="lss">
          <span class="tab-num">5</span> СЖО станции
        </button>
      </nav>

      <!-- GLOBAL ACTIONS -->
      <div class="topbar-actions">
        <button class="btn btn-amber" id="btn-open-missions">
          Задания <span class="badge-count" id="missions-badge">0/15</span>
        </button>
        <button class="btn" id="btn-open-ref">
          Справочник
        </button>
        <button class="btn btn-mentor-only" id="btn-open-mentor">
          Наставнику
        </button>
        <button class="btn" id="btn-share-link" title="Скопировать ссылку на текущий собранный стенд">
          🔗 Ссылка
        </button>
        <button class="btn" id="btn-save-file" title="Сохранить проект в файл .cosmolab">
          ⬇ .cosmolab
        </button>
        <button class="btn" id="btn-load-file" title="Открыть файл .cosmolab">
          📂
        </button>
        <input type="file" id="file-input-cosmolab" accept=".cosmolab,.json" style="display:none;" />
      </div>
    </header>

    <!-- ACTIVE MISSION BANNER (AUTO-GRADER) -->
    <section class="mission-bar hidden" id="mission-bar">
      <div class="mission-bar-info">
        <span class="mission-pill" id="mb-pill">ЗАДАНИЕ</span>
        <span class="mission-title" id="mb-title"></span>
        <span class="mission-goal" id="mb-desc"></span>
        <span style="font-family:var(--font-mono); font-size:11.5px; color:var(--cyan);" id="mb-progress"></span>
      </div>
      <div class="mission-bar-actions">
        <button class="btn btn-sm btn-amber" id="mb-btn-hint">Подсказка</button>
        <button class="btn btn-sm" id="mb-btn-reset">Сначала</button>
        <button class="btn btn-sm" id="mb-btn-close" title="Выйти в свободный режим">✕</button>
      </div>
    </section>

    <!-- MAIN 3-COLUMN WORKBENCH -->
    <main class="workbench">
      <aside class="panel-left" id="panel-left"></aside>
      <section class="panel-center" id="panel-center"></section>
      <aside class="panel-right" id="panel-right"></aside>
    </main>
  </div>

  <!-- MODAL 1: MISSIONS & TROUBLESHOOTING TASKS -->
  <div class="modal-backdrop hidden" id="modal-missions">
    <div class="modal-window">
      <div class="modal-header">
        <div class="modal-title">Практикумы и нештатные ситуации Космоквантума (автопроверка)</div>
        <button class="btn btn-sm" data-close-modal>✕ Закрыть</button>
      </div>
      <div class="modal-body" id="modal-missions-body"></div>
    </div>
  </div>

  <!-- MODAL 2: INTERACTIVE AEROSPACE REFERENCE -->
  <div class="modal-backdrop hidden" id="modal-ref">
    <div class="modal-window">
      <div class="modal-header">
        <div class="modal-title">Интерактивный справочник космонавтики и баллистики</div>
        <button class="btn btn-sm" data-close-modal>✕ Закрыть</button>
      </div>
      <div class="modal-body" id="modal-ref-body"></div>
    </div>
  </div>

  <!-- MODAL 3: MENTOR GUIDE & IFRAME EMBED -->
  <div class="modal-backdrop hidden" id="modal-mentor">
    <div class="modal-window">
      <div class="modal-header">
        <div class="modal-title">Наставнику Космоквантума: методика, ссылки и встраивание</div>
        <button class="btn btn-sm" data-close-modal>✕ Закрыть</button>
      </div>
      <div class="modal-body" id="modal-mentor-body"></div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
